<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root{ --bg1:#FFF0F5; --bg2:#FFE3EF; --accent:#FF6FA5; --ink:#5A3A4A; --card:rgba(255,255,255,.9); }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1920px;}
  body{
    font-family:"Zen Maru Gothic","Noto Sans CJK JP",sans-serif; color:var(--ink);
    background:
      radial-gradient(1100px 820px at 12% -6%, #ffffff 0%, rgba(255,255,255,0) 55%),
      radial-gradient(900px 700px at 108% 6%, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 50%),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    overflow:hidden; position:relative;
  }
  /* 背景の散らしデコ（ハート・星・キラキラ） */
  #bgdeco{position:absolute; inset:0; pointer-events:none; z-index:0;}
  #bgdeco svg{position:absolute;}
  /* レース風フレーム枠 */
  .frameborder{position:absolute; inset:0; z-index:2; pointer-events:none;}
  .corner{position:absolute; z-index:3; pointer-events:none;}

  .frame{position:absolute; inset:44px; display:flex; flex-direction:column; z-index:4;}

  /* ===== ヘッダー ===== */
  header{position:relative; text-align:center; padding:24px 40px 20px;
    background:rgba(255,255,255,.72); border-radius:44px;
    box-shadow:0 16px 40px rgba(255,120,170,.18), inset 0 0 0 3px rgba(255,255,255,.95),
               inset 0 0 0 6px rgba(255,175,205,.35);}
  .datepill{display:inline-block; font-weight:700; font-size:32px; letter-spacing:.04em; color:#fff;
    background:var(--accent); padding:7px 30px; border-radius:999px; margin-bottom:12px;
    box-shadow:0 8px 18px rgba(255,111,165,.38), inset 0 2px 0 rgba(255,255,255,.5);}
  h1{font-family:"Zen Maru Gothic"; font-weight:900; font-size:90px; line-height:1.04; color:var(--ink);
    white-space:nowrap; text-shadow:2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff, 0 10px 22px rgba(255,120,170,.22);}
  .subtitle{display:inline-block; margin-top:12px; font-size:34px; font-weight:700; color:#fff;
    background:var(--accent); padding:6px 26px; border-radius:999px; letter-spacing:.04em;
    box-shadow:0 8px 16px rgba(255,111,165,.30);}

  /* ===== リスト ===== */
  .list{flex:1; display:flex; flex-direction:column; justify-content:space-evenly; gap:10px; padding:16px 0;}
  .row{display:flex; align-items:center; gap:20px; background:var(--card); border-radius:28px; padding:12px 24px;
    box-shadow:0 10px 22px rgba(150,120,140,.13), inset 0 0 0 2px rgba(255,255,255,.9),
               inset 0 0 0 4px rgba(255,190,215,.30);}

  .lead{flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .lead>svg{width:92px; height:108px; display:block;}          /* ロゼットメダル(標準) */
  .few .lead>svg{width:132px; height:156px;}
  .micro .lead>svg{width:64px; height:76px;}
  .badge{width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:"M PLUS Rounded 1c"; font-weight:800; color:#fff; font-size:46px; line-height:1;
    box-shadow:0 8px 16px rgba(0,0,0,.14), inset 0 -5px 10px rgba(0,0,0,.10), inset 0 4px 8px rgba(255,255,255,.55);}
  .swatch{width:88px; height:88px; border-radius:22px;
    box-shadow:0 8px 16px rgba(0,0,0,.14), inset 0 0 0 5px rgba(255,255,255,.92);}
  .pair{display:flex; align-items:center; gap:2px;}
  .pair .mini{width:66px; height:66px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:26px; font-family:"Zen Maru Gothic";
    box-shadow:0 6px 12px rgba(0,0,0,.14), inset 0 3px 6px rgba(255,255,255,.5);}
  .pair .x{margin:0 -6px; z-index:1; color:var(--accent); font-size:30px;}

  .body{flex:1; min-width:0;}
  .name{font-size:44px; font-weight:900; font-family:"Zen Maru Gothic"; line-height:1.12;
    display:flex; align-items:baseline; gap:12px; white-space:nowrap;}
  .name .dates{font-size:23px; font-weight:500; color:#ac93a1;}
  .comment{margin-top:2px; font-size:29px; font-weight:700; color:#6b4b5b; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .art{flex:0 0 auto; width:96px; height:96px; display:flex; align-items:center; justify-content:center;}
  .art img{width:96px; height:96px; object-fit:contain;}

  .meta{flex:0 0 auto; width:220px; text-align:right;}
  .stars{font-size:31px; color:var(--accent); letter-spacing:2px; line-height:1;}
  .stars .off{color:rgba(255,111,165,.26);}
  .item{margin-top:6px; font-size:22px; font-weight:500; color:#9a7f8d;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ===== 少数行(血液型など)：ゆったり ===== */
  .list.few{gap:20px; padding:26px 0; justify-content:space-evenly;}
  .few .row{padding:28px 32px; gap:26px;}
  .few .badge{width:128px; height:128px; font-size:64px;}
  .few .swatch{width:128px; height:128px; border-radius:30px;}
  .few .name{font-size:64px;}
  .few .name .dates{font-size:28px;}
  .few .comment{font-size:42px; white-space:normal;}
  .few .art,.few .art img{width:132px; height:132px;}
  .few .meta{width:290px;}
  .few .stars{font-size:42px;}
  .few .item{font-size:29px; white-space:normal;}

  /* ===== 多数行(MBTI16)：超コンパクト ===== */
  .list.micro{gap:7px; padding:10px 0;}
  .micro .row{padding:8px 20px; gap:16px; border-radius:22px;}
  .micro .badge{width:62px; height:62px; font-size:32px;}
  .micro .name{font-size:34px;}
  .micro .name .dates{font-size:21px;}
  .micro .comment{font-size:24px;}
  .micro .art{display:none;}
  .micro .meta{width:168px;}
  .micro .stars{font-size:25px;}
  .micro .item{font-size:19px; margin-top:3px;}

  /* ===== フッター ===== */
  footer{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:4px 6px 0;}
  .handle{font-size:33px; font-weight:700; color:var(--accent); opacity:.92;}
  .disclaimer{font-size:20px; color:rgba(120,90,105,.55); font-weight:500;}
  .cta{font-size:37px; font-weight:800; color:#fff; background:var(--accent);
    padding:14px 36px; border-radius:999px;
    box-shadow:0 10px 22px rgba(255,111,165,.36), inset 0 2px 0 rgba(255,255,255,.45);}
</style>
</head>
<body>
  <div id="bgdeco"></div>

  <!-- レース風フレーム（真珠ドットの縁取り＋内側の白ライン） -->
  <svg class="frameborder" viewBox="0 0 1080 1920" preserveAspectRatio="none">
    <rect x="20" y="20" width="1040" height="1880" rx="60" ry="60"
      fill="none" stroke="#FFB4D2" stroke-width="16" stroke-linecap="round"
      stroke-dasharray="0.1 27" opacity="0.9"/>
    <rect x="40" y="40" width="1000" height="1840" rx="46" ry="46"
      fill="none" stroke="#ffffff" stroke-width="5" opacity="0.85"/>
  </svg>

  <!-- コーナー装飾（リボン・くま） -->
  <svg class="corner" style="left:12px; top:8px" width="180" height="150" viewBox="0 0 180 150" id="bow-tl"></svg>
  <svg class="corner" style="right:12px; bottom:10px" width="170" height="140" viewBox="0 0 180 150" id="bow-br"></svg>
  <svg class="corner" style="right:26px; top:150px" width="150" height="150" viewBox="0 0 120 120" id="bear-tr"></svg>

  <div class="frame">
    <header>
      <div class="datepill" id="datepill"></div>
      <h1 id="title"></h1>
      <div class="subtitle" id="subtitle"></div>
    </header>
    <div class="list" id="list"></div>
    <footer>
      <div class="handle" id="handle"></div>
      <div class="disclaimer">※エンタメ占いです</div>
      <div class="cta" id="cta"></div>
    </footer>
  </div>

<script>
/* ---------- SVGパーツ ---------- */
function heartPath(cx,cy,s,fill,op){
  return `<path transform="translate(${cx},${cy}) scale(${s})" opacity="${op}" fill="${fill}"
    d="M0,3 C0,-1 -6,-1 -6,3 C-6,7 0,10 0,12 C0,10 6,7 6,3 C6,-1 0,-1 0,3 Z"/>`;
}
function starPath(cx,cy,s,fill,op){
  let pts=[];
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;pts.push([Math.cos(a)*6,Math.sin(a)*6]);
    const b=a+Math.PI/5;pts.push([Math.cos(b)*2.6,Math.sin(b)*2.6]);}
  const d="M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L")+" Z";
  return `<path transform="translate(${cx},${cy}) scale(${s})" opacity="${op}" fill="${fill}" d="${d}"/>`;
}
function sparkle(cx,cy,s,fill,op){
  return `<path transform="translate(${cx},${cy}) scale(${s})" opacity="${op}" fill="${fill}"
    d="M0,-8 C1,-2 2,-1 8,0 C2,1 1,2 0,8 C-1,2 -2,1 -8,0 C-2,-1 -1,-2 0,-8 Z"/>`;
}
// 背景デコを敷き詰める（固定シードで毎回同じ配置）
function seedRand(seed){return function(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};}
function buildBgDeco(){
  const R=seedRand(20260727); const cols=["#FFB0CE","#FFD1E4","#C9B7FF","#BDE9FF","#FFE39A","#B6F0D8"];
  let out="";
  for(let i=0;i<44;i++){
    const x=R()*1080, y=R()*1920, s=0.7+R()*1.8, op=0.16+R()*0.22, c=cols[(R()*cols.length)|0];
    const k=(R()*3)|0;
    out+=`<svg width="60" height="60" style="left:${x-30}px;top:${y-30}px"><g transform="translate(30,30)">`+
      (k===0?heartPath(0,0,s*2.4,c,op):k===1?starPath(0,0,s*2,c,op):sparkle(0,0,s*1.6,c,op))+`</g></svg>`;
  }
  document.getElementById("bgdeco").innerHTML=out;
}
function bow(color,dark){
  return `
   <path d="M90,70 C60,45 20,45 22,75 C20,105 60,105 90,80 Z" fill="${color}"/>
   <path d="M90,70 C120,45 160,45 158,75 C160,105 120,105 90,80 Z" fill="${color}"/>
   <path d="M90,70 C60,45 20,45 22,75 C40,70 70,68 90,75 Z" fill="${dark}" opacity=".25"/>
   <path d="M90,70 C120,45 160,45 158,75 C140,70 110,68 90,75 Z" fill="${dark}" opacity=".25"/>
   <path d="M82,78 C78,110 74,130 70,145 L92,138 Z" fill="${color}"/>
   <path d="M98,78 C102,110 106,130 110,145 L88,138 Z" fill="${color}"/>
   <ellipse cx="90" cy="76" rx="16" ry="18" fill="${dark}" opacity=".85"/>
   <ellipse cx="90" cy="72" rx="12" ry="12" fill="#ffffff" opacity=".35"/>`;
}
function bear(){
  const OL="#D9A579";
  return `
   <circle cx="30" cy="34" r="16" fill="#EFC49B" stroke="${OL}" stroke-width="2"/>
   <circle cx="90" cy="34" r="16" fill="#EFC49B" stroke="${OL}" stroke-width="2"/>
   <circle cx="30" cy="34" r="8" fill="#FBDCC4"/><circle cx="90" cy="34" r="8" fill="#FBDCC4"/>
   <circle cx="60" cy="60" r="42" fill="#F2CBA1" stroke="${OL}" stroke-width="2"/>
   <ellipse cx="60" cy="72" rx="22" ry="18" fill="#FBEAD6"/>
   <circle cx="46" cy="56" r="5.5" fill="#5B4030"/><circle cx="74" cy="56" r="5.5" fill="#5B4030"/>
   <circle cx="47.5" cy="54" r="1.6" fill="#fff"/><circle cx="75.5" cy="54" r="1.6" fill="#fff"/>
   <circle cx="40" cy="68" r="7" fill="#FF9CC0" opacity=".6"/><circle cx="80" cy="68" r="7" fill="#FF9CC0" opacity=".6"/>
   <ellipse cx="60" cy="66" rx="4.5" ry="3.2" fill="#7A5238"/>
   <path d="M60,69 q-6,7 -12,3 M60,69 q6,7 12,3" stroke="#7A5238" stroke-width="2.6" fill="none" stroke-linecap="round"/>
   <path d="M52,92 q8,7 16,0" stroke="#FF7FB0" stroke-width="4" fill="none" stroke-linecap="round"/>`;
}
// ロゼット型メダル（1〜3位）
function rosette(rank){
  const c = rank===1 ? ["#FFDE7A","#F2B32E","#7A5B12"]
          : rank===2 ? ["#E4ECF5","#B9C6D6","#5A6675"]
                     : ["#F3C79A","#D59A63","#7A4E27"];
  return `<svg width="100%" height="100%" viewBox="0 0 100 118">
    <path d="M34,74 L20,116 L38,104 L44,84 Z" fill="${c[1]}"/>
    <path d="M66,74 L80,116 L62,104 L56,84 Z" fill="${c[1]}"/>
    <circle cx="50" cy="50" r="46" fill="none" stroke="${c[0]}" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="0.1 15"/>
    <circle cx="50" cy="50" r="38" fill="${c[1]}"/>
    <circle cx="50" cy="50" r="32" fill="${c[0]}"/>
    <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
      font-family="M PLUS Rounded 1c" font-weight="800" font-size="40" fill="#fff">${rank}</text>
    <ellipse cx="40" cy="38" rx="12" ry="7" fill="#fff" opacity=".45"/>
  </svg>`;
}
// キャラ画像が無いとき用の、可愛いスター＆ハートのマスコット（行の色で着色）
function stickerSVG(grad, love){
  const g=grad||["#FFB0CE","#FF7EB6"];
  if(love){
    return `<svg width="100%" height="100%" viewBox="0 0 100 100">
      <path d="M50,32 C50,16 24,16 24,36 C24,58 50,74 50,82 C50,74 76,58 76,36 C76,16 50,16 50,32 Z" fill="${g[1]}"/>
      <circle cx="41" cy="46" r="4.5" fill="#5A3A4A"/><circle cx="59" cy="46" r="4.5" fill="#5A3A4A"/>
      <circle cx="35" cy="54" r="6" fill="#fff" opacity=".45"/><circle cx="65" cy="54" r="6" fill="#fff" opacity=".45"/>
      <path d="M46,54 q4,4 8,0" stroke="#5A3A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>`;
  }
  let pts=[];for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;pts.push([50+Math.cos(a)*40,50+Math.sin(a)*40]);
    const b=a+Math.PI/5;pts.push([50+Math.cos(b)*18,50+Math.sin(b)*18]);}
  const d="M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L")+" Z";
  return `<svg width="100%" height="100%" viewBox="0 0 100 100">
    <path d="${d}" fill="${g[1]}"/>
    <circle cx="43" cy="50" r="4" fill="#5A3A4A"/><circle cx="57" cy="50" r="4" fill="#5A3A4A"/>
    <circle cx="38" cy="57" r="5" fill="#fff" opacity=".5"/><circle cx="62" cy="57" r="5" fill="#fff" opacity=".5"/>
    <path d="M46,57 q4,4 8,0" stroke="#5A3A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- 本体 ---------- */
function starStr(n){let s='';for(let i=0;i<5;i++)s+=(i<n)?'<span>★</span>':'<span class="off">★</span>';return s;}
// タイトルを1行に収める（長いテーマ名でも自動縮小）
function fitTitle(){
  const h=document.getElementById('title');
  const max=(h.parentElement.clientWidth)-80;
  let fs=90; h.style.fontSize=fs+'px';
  while(h.scrollWidth>max && fs>52){ fs-=2; h.style.fontSize=fs+'px'; }
}

function render(d){
  const P=d.palette||{}; const rs=document.documentElement.style;
  for(const k of ['bg1','bg2','accent','ink']) if(P[k]) rs.setProperty('--'+k,P[k]);

  buildBgDeco();
  document.getElementById('bow-tl').innerHTML=bow('#FF9CC2','#E85C97');
  document.getElementById('bow-br').innerHTML=bow('#FFB0D0','#E85C97');
  document.getElementById('bear-tr').innerHTML=bear();

  document.getElementById('datepill').textContent=d.date_label;
  document.getElementById('title').textContent=d.title;
  document.getElementById('subtitle').textContent=d.subtitle;
  document.getElementById('handle').textContent=d.handle||'';
  document.getElementById('cta').textContent=d.cta||'';

  const n=d.rows.length;
  const size = n<=6 ? 'few' : (n>12 ? 'micro' : 'std');
  const love = /love|恋愛|LOVE|相性|ペア/.test((d.subtitle||'')+d.theme);
  const list=document.getElementById('list');
  list.className='list '+size;
  list.innerHTML='';

  for(const row of d.rows){
    const el=document.createElement('div');
    el.className='row'+((row.rank>=1&&row.rank<=3)?(' medal'+row.rank):'');

    // 左（順位/ペア/カラー）
    let lead;
    if(row.pair){
      const [a,b]=row.pair;
      lead=`<div class="pair">
        <div class="mini" style="background:linear-gradient(145deg,${a.grad[0]},${a.grad[1]})">${a.name.replace('型','').replace('座','')}</div>
        <div class="x">×</div>
        <div class="mini" style="background:linear-gradient(145deg,${b.grad[0]},${b.grad[1]})">${b.name.replace('型','').replace('座','')}</div>
      </div>`;
    } else if(d.mode==='color'&&row.swatch){
      lead=`<div class="swatch" style="background:${row.swatch}"></div>`;
    } else if(row.rank>=1&&row.rank<=3){
      lead=rosette(row.rank);
    } else {
      const g=row.grad||['#FF9A8B','#FF6A88'];
      lead=`<div class="badge" style="background:linear-gradient(145deg,${g[0]},${g[1]})">${row.rank??''}</div>`;
    }

    const dates=row.sub?`<span class="dates">${row.sub}</span>`:'';
    // アート列（キャラ画像 or マスコット）。ペア・microでは非表示。
    // アート列はキャラ画像(row.mascot)がある時だけ表示。
    // 画像が無いうちは列ごと省いて、コメントを広く見せる（詳細は docs/mascots.md）。
    let art='';
    if(row.mascot && !row.pair && size!=='micro'){
      art=`<div class="art"><img src="${row.mascot}" alt=""></div>`;
    }
    const stars=(row.stars!=null)?`<div class="stars">${starStr(row.stars)}</div>`:'';
    const metaText = (size==='few')?(row.note||''):(row.item||'');
    const meta=`<div class="meta">${stars}${metaText?`<div class="item">${metaText}</div>`:''}</div>`;

    el.innerHTML=`<div class="lead">${lead}</div>
      <div class="body"><div class="name">${row.name}${dates}</div><div class="comment">${row.comment}</div></div>
      ${art}${meta}`;
    list.appendChild(el);
  }
  fitTitle();
}
if(window.__DATA__) render(window.__DATA__);
// フォント読み込み後にタイトル幅を再調整（正確な字幅で計算するため）
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
</script>
</body>
</html>

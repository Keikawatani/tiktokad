<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<!--
  初稿(ドラフト)用テンプレート：装飾は最小限。
  「中身（順位・コメント・ラッキー情報）」を読みやすく並べるだけのシンプルレイアウト。
  この上からデザインを自由に載せ替えて使う想定。
-->
<style>
  :root{ --accent:#FF6FA5; --ink:#222; --sub:#8a8a8a; --line:#ececec; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1920px;}
  body{font-family:"Zen Maru Gothic","Noto Sans CJK JP",sans-serif; color:var(--ink); background:#fff;}
  .frame{position:absolute; inset:0; display:flex; flex-direction:column; padding:70px 70px 56px;}

  header{padding-bottom:20px; border-bottom:3px solid var(--line);}
  .date{font-size:34px; font-weight:700; color:var(--accent); letter-spacing:.05em;}
  h1{font-size:88px; font-weight:900; line-height:1.06; margin-top:8px; white-space:nowrap;}
  .subtitle{font-size:36px; font-weight:700; color:var(--sub); margin-top:10px;}

  .list{flex:1; display:flex; flex-direction:column; justify-content:space-evenly; padding:20px 0;}
  .row{display:flex; align-items:center; gap:28px; padding:14px 4px; border-bottom:2px solid var(--line);}
  .row:last-child{border-bottom:none;}

  .lead{flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .num{width:86px; height:86px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:"M PLUS Rounded 1c"; font-weight:800; color:#fff; font-size:44px;}
  .row.r1 .num{background:#F2B32E;} .row.r2 .num{background:#B9C6D6;} .row.r3 .num{background:#D59A63;}
  .num.plain{background:#e9e9e9; color:#666;}
  .swatch{width:86px; height:86px; border-radius:16px; border:3px solid #eee;}
  .pair{display:flex; align-items:center; gap:2px;}
  .pair .mini{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:24px;}
  .pair .x{margin:0 -4px; color:var(--accent); font-size:28px; z-index:1;}

  .body{flex:1; min-width:0;}
  .name{font-size:46px; font-weight:900; line-height:1.1; display:flex; align-items:baseline; gap:12px; white-space:nowrap;}
  .name .dates{font-size:24px; font-weight:500; color:var(--sub);}
  .comment{font-size:32px; font-weight:700; color:#444; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .meta{flex:0 0 auto; width:250px; text-align:right;}
  .stars{font-size:32px; color:var(--accent); letter-spacing:2px;}
  .stars .off{color:#e7cdd7;}
  .item{font-size:24px; color:var(--sub); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* 少数行 */
  .list.few .row{padding:26px 4px;}
  .few .num{width:120px; height:120px; font-size:60px;}
  .few .swatch{width:120px; height:120px;}
  .few .name{font-size:60px;} .few .comment{font-size:40px; white-space:normal;}
  .few .meta{width:300px;} .few .stars{font-size:40px;} .few .item{font-size:28px; white-space:normal;}
  /* 多数行(MBTI16) */
  .list.micro .row{padding:6px 4px; gap:20px;}
  .micro .num{width:58px; height:58px; font-size:30px;}
  .micro .name{font-size:34px;} .micro .comment{font-size:24px;}
  .micro .meta{width:180px;} .micro .stars{font-size:24px;} .micro .item{font-size:19px;}

  footer{display:flex; justify-content:space-between; align-items:center; padding-top:16px; border-top:3px solid var(--line);}
  .handle{font-size:32px; font-weight:700; color:var(--accent);}
  .note{font-size:24px; color:#bbb;}
</style>
</head>
<body>
  <div class="frame">
    <header>
      <div class="date" id="date"></div>
      <h1 id="title"></h1>
      <div class="subtitle" id="subtitle"></div>
    </header>
    <div class="list" id="list"></div>
    <footer>
      <div class="handle" id="handle"></div>
      <div class="note">※エンタメ占い（初稿）</div>
    </footer>
  </div>
<script>
function starStr(n){let s='';for(let i=0;i<5;i++)s+=(i<n)?'<span>★</span>':'<span class="off">★</span>';return s;}
function fitTitle(){const h=document.getElementById('title');const max=h.parentElement.clientWidth;let fs=88;h.style.fontSize=fs+'px';
  while(h.scrollWidth>max&&fs>48){fs-=2;h.style.fontSize=fs+'px';}}
function render(d){
  const P=d.palette||{}; if(P.accent) document.documentElement.style.setProperty('--accent',P.accent);
  document.getElementById('date').textContent=d.date_label;
  document.getElementById('title').textContent=d.title;
  document.getElementById('subtitle').textContent=d.subtitle;
  document.getElementById('handle').textContent=d.handle||'';
  const n=d.rows.length; const size=n<=6?'few':(n>12?'micro':'std');
  const list=document.getElementById('list'); list.className='list '+size; list.innerHTML='';
  for(const row of d.rows){
    const el=document.createElement('div');
    el.className='row'+((row.rank>=1&&row.rank<=3)?(' r'+row.rank):'');
    let lead;
    if(row.pair){const[a,b]=row.pair;
      lead=`<div class="pair"><div class="mini" style="background:${a.grad[1]}">${a.name.replace('型','').replace('座','')}</div>
        <div class="x">×</div><div class="mini" style="background:${b.grad[1]}">${b.name.replace('型','').replace('座','')}</div></div>`;
    } else if(d.mode==='color'&&row.swatch){ lead=`<div class="swatch" style="background:${row.swatch}"></div>`;
    } else { const cls=(row.rank>=1&&row.rank<=3)?'':' plain';
      lead=`<div class="num${cls}">${row.rank??''}</div>`; }
    const dates=row.sub?`<span class="dates">${row.sub}</span>`:'';
    const stars=(row.stars!=null)?`<div class="stars">${starStr(row.stars)}</div>`:'';
    const metaText=(size==='few')?(row.note||''):(row.item||'');
    const meta=`<div class="meta">${stars}${metaText?`<div class="item">${metaText}</div>`:''}</div>`;
    el.innerHTML=`<div class="lead">${lead}</div><div class="body"><div class="name">${row.name}${dates}</div>
      <div class="comment">${row.comment}</div></div>${meta}`;
    list.appendChild(el);
  }
  fitTitle();
}
if(window.__DATA__) render(window.__DATA__);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitTitle);
</script>
</body>
</html>
